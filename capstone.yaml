project:
  identifier: flyrank-capstone-metering-billing-ai
  title: FlyRank Backend Capstone — Usage Metering & Billing Engine
  implementation_origin: ai-generated

status:
  phase: 5
  state: completed
  implementation_started: true
  review_note: >
    Completed. T16.5 owner review was demonstrated on 2026-08-24: the owner
    explained idempotency, quota boundaries, integer-safe pricing, Stripe
    authority and webhook deduplication, tenant isolation, and retry-safe
    monthly rollups in their own words. Three implementation-specific
    corrections were recorded rather than silently accepted: quota enforcement
    uses persisted usage-event totals with current + attempted <= limit rather
    than an atomic counter-row update; pricing combines integer category
    numerators and rounds once to cents rather than persisting per-event
    micro-unit prices; and tenant authorization uses endpoint-bound HMAC proofs
    plus tenant-scoped queries rather than API-key-derived tenant identity.

planned_stack:
  language: Python
  framework: FastAPI
  database: PostgreSQL
  containerization: Docker
  orm: SQLAlchemy
  migrations: Alembic
  testing: pytest
  payments: Stripe test mode only

core_scope:
  plans:
    - Free
    - Pro
  usage_types:
    - API calls
    - AI tokens
  billable_endpoint: POST /generate
  usage_endpoint: GET /usage
  intentionally_excluded:
    - Real AI calls
    - Invoicing
    - Overage billing
    - Proration
    - Production dashboards
    - Microservices
    - Kubernetes
    - Paid infrastructure
    - Production Stripe
    - Production authentication and authorization
    - Background scheduling
    - Refunds and taxes

demo:
  optional_demo_mode: true
  route: /demo
  tenant_scope: deterministic seeded demo tenant only
  real_metering_requests: true
  report_exports:
    - JSON
    - CSV
  note: >
    The demo page is an opt-in reviewer convenience, not a production dashboard.
    It is disabled unless DEMO_MODE=true and does not weaken the normal protected
    tenant-scoped API endpoints.

implementation_note: >
  This control file records the implemented capstone boundary. The generation
  route is simulated; tenant proofs are issued by a trusted local gateway or
  authentication layer and are not a production identity system.
