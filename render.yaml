databases:
  - name: flyrank-capstone-metering-billing-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: flyrank_capstone_metering_billing_db
    user: flyrank_capstone_metering_billing_db_user

services:
  - type: web
    name: flyrank-capstone-metering-billing-ai
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install uv && uv sync --locked
    startCommand: uv run alembic upgrade head && uv run python -m app.data.seed && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flyrank-capstone-metering-billing-db
          property: connectionString
