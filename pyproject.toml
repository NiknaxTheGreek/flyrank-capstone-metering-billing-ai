[project]
name = "flyrank-capstone-metering-billing-ai"
version = "0.1.0"
description = "FlyRank Usage Metering & Billing Engine capstone"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
