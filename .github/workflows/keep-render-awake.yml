name: Keep Render demo warm

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub Actions scheduling delays.
    # Render free web services sleep after 15 minutes of inactivity, so ping every 5 minutes.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping capstone health endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://flyrank-capstone-metering-billing-ai.onrender.com'

          # A GET is intentionally side-effect free. Retries also recover the service
          # if a prior scheduled run was delayed and Render has already spun it down.
          body="$(mktemp)"
          code="$(curl -sS -L \
            --connect-timeout 20 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -o "$body" \
            -w '%{http_code}' \
            "$BASE/api/healthz")"

          echo "HTTP $code"
          cat "$body"
          echo
          test "$code" = '200'
