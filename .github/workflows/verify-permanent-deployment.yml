name: Verify permanent deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-permanent-deployment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify permanent public demo
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://flyrank-capstone-metering-billing-ai.onrender.com'
          KEY="permanent-gha-${GITHUB_RUN_ID}"

          # Wake the free service and wait for a clean health response before any writes.
          health_file="$(mktemp)"
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o "$health_file" -w '%{http_code}' "$BASE/api/healthz" || true)"
            if [ "$code" = '200' ] && python -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1])).get("status") == "ok" else 1)' "$health_file"; then
              break
            fi
            if [ "$attempt" = '12' ]; then
              echo "health verification failed: HTTP $code"
              cat "$health_file" || true
              exit 1
            fi
            sleep 10
          done

          demo_code="$(curl -sS -o /tmp/demo.html -w '%{http_code}' "$BASE/demo")"
          test "$demo_code" = '200'
          grep -q 'Usage Metering & Billing Engine' /tmp/demo.html

          # Start from a deterministic clean reviewer tenant before proving first-write/replay behavior.
          reset_before="$(curl -sS -o /tmp/reset-before.json -w '%{http_code}' -X POST "$BASE/demo/api/reset")"
          test "$reset_before" = '200'

          first_file="$(mktemp)"
          first_code="$(curl -sS -o "$first_file" -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d "{\"usage_type\":\"api_call\",\"quantity\":1,\"idempotency_key\":\"$KEY\"}" \
            "$BASE/demo/api/generate")"
          test "$first_code" = '201'
          python -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1]))["result"]["idempotent_replay"] is False else 1)' "$first_file"

          replay_file="$(mktemp)"
          replay_code="$(curl -sS -o "$replay_file" -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d "{\"usage_type\":\"api_call\",\"quantity\":1,\"idempotency_key\":\"$KEY\"}" \
            "$BASE/demo/api/generate")"
          test "$replay_code" = '200'
          python -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1]))["result"]["idempotent_replay"] is True else 1)' "$replay_file"

          report_code="$(curl -sS -o /tmp/report.csv -w '%{http_code}' "$BASE/demo/report.csv")"
          test "$report_code" = '200'
          grep -q 'tenant_id' /tmp/report.csv

          reset_code="$(curl -sS -o /tmp/reset.json -w '%{http_code}' -X POST "$BASE/demo/api/reset")"
          test "$reset_code" = '200'
          python -c 'import json; raise SystemExit(0 if json.load(open("/tmp/reset.json"))["reset"] is True else 1)'

          cat > .github/PERMANENT_DEPLOYMENT_STATUS.txt <<EOF
          success-public-request-verified
          base=$BASE
          health=200-ok
          demo=200
          first_metering_request=201
          idempotent_replay=200-true
          csv_report=200
          reset=200
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Commit verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/PERMANENT_DEPLOYMENT_STATUS.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record permanent deployment verification [skip ci]'
          git push origin HEAD:main
