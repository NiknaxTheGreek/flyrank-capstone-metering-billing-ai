name: Attach final capstone submission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify submission ZIP exists
        run: |
          set -euo pipefail
          test -f FlyRank_Backend_Capstone_Submission.zip
          unzip -t FlyRank_Backend_Capstone_Submission.zip

      - name: Upload final submission attachment
        uses: actions/upload-artifact@v4
        with:
          name: FlyRank_Backend_Capstone_Submission
          path: FlyRank_Backend_Capstone_Submission.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish attachment run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/ATTACHMENT_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ATTACHMENT_RUN_ID.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish submission attachment run [skip ci]'
          git push origin HEAD:main
