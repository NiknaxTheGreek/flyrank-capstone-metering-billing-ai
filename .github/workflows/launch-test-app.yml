name: Launch temporary test app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launch-test-app.yml'
      - 'app/api/demo.py'
      - 'app/main.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flyrank_metering
          POSTGRES_USER: flyrank
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyrank -d flyrank_metering"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://flyrank@127.0.0.1:5432/flyrank_metering
      DEMO_MODE: 'true'
      STRIPE_SECRET_KEY: sk_test_ephemeral_placeholder
      STRIPE_PRO_PRICE_ID: price_ephemeral_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ephemeral_placeholder
      STRIPE_SUCCESS_URL: https://example.com/success
      STRIPE_CANCEL_URL: https://example.com/cancel

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Generate ephemeral tenant-proof secret
        shell: bash
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install and verify project
        run: |
          set -euo pipefail
          uv sync --locked
          docker compose -f compose.yml config --quiet
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m app.data.seed
          uv run python -m app.data.seed
          uv run --locked pytest -q

      - name: Start FastAPI
        shell: bash
        run: |
          set -euo pipefail
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/uvicorn.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/healthz | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uvicorn.log
          exit 1

      - name: Smoke-test interactive demo locally
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/demo | grep -q 'Make a real metering request'
          FIRST=$(curl -sS -o /tmp/demo-first.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"usage_type":"api_call","quantity":1,"idempotency_key":"gha-demo-smoke"}' \
            http://127.0.0.1:8000/demo/api/generate)
          test "$FIRST" = '201'
          grep -q '"idempotent_replay":false' /tmp/demo-first.json
          SECOND=$(curl -sS -o /tmp/demo-second.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"usage_type":"api_call","quantity":1,"idempotency_key":"gha-demo-smoke"}' \
            http://127.0.0.1:8000/demo/api/generate)
          test "$SECOND" = '200'
          grep -q '"idempotent_replay":true' /tmp/demo-second.json
          curl -fsS http://127.0.0.1:8000/demo/report.csv | grep -q 'tenant_id'
          curl -fsS -X POST http://127.0.0.1:8000/demo/api/reset | grep -q '"reset":true'

      - name: Install Cloudflare quick tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Publish externally verified temporary demo URL
        shell: bash
        run: |
          set -euo pipefail
          nohup cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          URL=''
          for i in {1..40}; do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          PUBLIC_READY='false'
          for i in {1..30}; do
            if curl -fsS "$URL/demo" | grep -q 'Make a real metering request'; then
              PUBLIC_READY='true'
              break
            fi
            sleep 1
          done
          test "$PUBLIC_READY" = 'true'

          PUBLIC_STATUS=$(curl -sS -o /tmp/public-demo.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"usage_type":"api_call","quantity":1,"idempotency_key":"gha-public-demo-smoke"}' \
            "$URL/demo/api/generate")
          test "$PUBLIC_STATUS" = '201'
          grep -q '"idempotent_replay":false' /tmp/public-demo.json
          curl -fsS "$URL/demo/report.csv" | grep -q 'tenant_id'
          curl -fsS -X POST "$URL/demo/api/reset" | grep -q '"reset":true'
          curl -fsS "$URL/api/healthz" | grep -q '"status":"ok"'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          printf '%s\n' "$URL/demo" > .github/TEMP_TEST_APP_URL.txt
          printf '%s\n' "$URL/api/healthz" > .github/TEMP_HEALTH_URL.txt
          printf 'success-public-request-verified\n' > .github/TEMP_TEST_STATUS.txt
          git add .github/TEMP_TEST_APP_URL.txt .github/TEMP_HEALTH_URL.txt .github/TEMP_TEST_STATUS.txt
          git commit -m 'Publish verified capstone demo URL [skip ci]'
          git push origin HEAD:main

      - name: Report launch failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          printf 'failed\n' > .github/TEMP_TEST_STATUS.txt
          git add .github/TEMP_TEST_STATUS.txt
          git commit -m 'Record temporary capstone launch failure [skip ci]' || true
          git push origin HEAD:main || true

      - name: Keep temporary test app available
        run: sleep 6300
