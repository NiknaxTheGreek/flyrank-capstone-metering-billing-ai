name: Package capstone submission ZIP

on:
  push:
    branches: [main]
    paths-ignore:
      - 'FlyRank_Backend_Capstone_Submission.zip'
      - 'flyrank-capstone-metering-billing-ai.zip'
      - '.github/TEMP_TEST_APP_URL.txt'
      - '.github/TEMP_HEALTH_URL.txt'
      - '.github/TEMP_TEST_STATUS.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build current submission ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='FlyRank_Backend_Capstone_Submission.zip'
          rm -f "$OUTPUT"
          git archive --format=zip --output="$OUTPUT" HEAD -- \
            . \
            ':(exclude)FlyRank_Backend_Capstone_Submission.zip' \
            ':(exclude)flyrank-capstone-metering-billing-ai.zip' \
            ':(exclude).github/TEMP_TEST_APP_URL.txt' \
            ':(exclude).github/TEMP_HEALTH_URL.txt' \
            ':(exclude).github/TEMP_TEST_STATUS.txt'
          unzip -t "$OUTPUT"
          sha256sum "$OUTPUT"

      - name: Commit refreshed ZIP to main
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='FlyRank_Backend_Capstone_Submission.zip'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$OUTPUT"
          if git diff --cached --quiet; then
            echo 'Submission ZIP already matches current main.'
            exit 0
          fi
          git commit -m 'Refresh capstone submission ZIP [skip ci]'
          git push origin HEAD:main
